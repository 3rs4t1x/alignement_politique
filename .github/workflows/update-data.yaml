name: Mettre a jour les votes

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Télécharger, analyser et résumer les scrutins
        # Important : depuis le 19/06/2026, Google refuse les clés Gemini qui n'ont
        # pas de restriction d'API configurée (Google Cloud Console > Identifiants >
        # Restrictions de clé API > "Generative Language API" uniquement).
        # Si les résumés IA cessent soudainement de se générer, c'est la cause la
        # plus probable — vérifier aussi que le secret GEMINI_API_KEY existe bien
        # dans Settings > Secrets and variables > Actions de ce dépôt.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_votes.py

      - name: Sauvegarder et commiter les modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/votes.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour automatique des votes et résumés IA"
          git push